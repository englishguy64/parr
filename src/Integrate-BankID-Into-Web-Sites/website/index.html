<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Integrate BankID Into Web Sites</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Integrate BankID Into Web Sites</h1>

    <fieldset id="mode-picker">
      <legend>BankID Environment</legend>
      <label><input type="radio" name="mode" value="test" checked> Test</label>
      <label><input type="radio" name="mode" value="production"> Production</label>
      <p id="mode-note"></p>
    </fieldset>

    <section id="signed-out">
      <p>Sign in with BankID.</p>
      <button id="start-phone" type="button">BankID On This Device</button>
      <button id="start-pc" type="button">BankID On Another Device</button>
    </section>

    <section id="waiting" hidden>
      <div id="qr" aria-label="BankID QR code"></div>
      <p id="message"></p>
      <button id="cancel" type="button">Cancel</button>
    </section>

    <section id="signed-in" hidden>
      <p>Signed in as <strong id="name"></strong></p>
      <p>Personal Number (YYYYMMDDNNNN): <strong id="personal-number"></strong></p>
      <p>Environment: <strong id="signed-in-mode"></strong></p>
      <button id="signout" type="button">Sign Out</button>
    </section>
  </main>

  <script src="lib/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
