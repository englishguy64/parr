# Foundry Toolkit for VS Code / azd: two hosted agents that deploy from source (no container, no registry).
# The Toolkit can create this file for you in its Deploy Hosted Agent wizard. Check it against what the wizard generates,
# because the hosted agent tooling is in preview and the format may change.
#
# Agent names must start with "agui-". Foundry runs `dotnet restore` and `dotnet publish` on the zipped project folder.
# Do not add FOUNDRY_PROJECT_ENDPOINT here: the platform sets it.
name: agui-hostedagents

services:
  agui-support:
    host: azure.ai.agent
    project: agui-support
    kind: hosted
    codeConfiguration:
      runtime: dotnet_10
      entryPoint:
        - dotnet
        - agui-support.dll
      dependencyResolution: remote_build
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1-mini

  agui-research:
    host: azure.ai.agent
    project: agui-research
    kind: hosted
    codeConfiguration:
      runtime: dotnet_10
      entryPoint:
        - dotnet
        - agui-research.dll
      dependencyResolution: remote_build
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1-mini
